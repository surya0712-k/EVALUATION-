name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DOCKERHUB_BACKEND: suryakanneti/evaluation-backend
  DOCKERHUB_FRONTEND: suryakanneti/evaluation-frontend
  EC2_DEPLOY_PATH: ~/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_BACKEND }}:latest
            ${{ env.DOCKERHUB_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_FRONTEND }}:latest
            ${{ env.DOCKERHUB_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ env.EC2_DEPLOY_PATH }}
            docker compose pull backend frontend mcp
            docker compose up -d --remove-orphans
            docker compose ps
            curl -sf http://127.0.0.1:8000/status > /dev/null && echo "Backend OK"
            curl -sf http://127.0.0.1:8090/health > /dev/null && echo "MCP OK" || echo "MCP health skipped (service may be absent)"
